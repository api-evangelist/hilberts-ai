apis:
- name: Hilbert's Program API
  description: >-
    The backend API of the Hilbert growth-infrastructure application. Its OpenAPI
    3.0.0 document is published unauthenticated through a Swagger UI at
    https://app-api.hilberts.ai/api-docs. The document declares two security schemes
    (Auth0-issued bearer JWT and an x-api-key header for server-to-server calls) and
    eight component schemas covering users, organizations, metric calculation, and
    project goal tracking, but its paths object is empty, so no operations are
    documented. The production base URL is https://app-api.hilberts.ai/api/v1,
    observed as the configured API base and Auth0 audience in the application's own
    public JavaScript bundle; the spec's own servers[] block still carries the
    development placeholder http://localhost:3000/api/v1.
  humanURL: https://app-api.hilberts.ai/api-docs
  baseURL: https://app-api.hilberts.ai/api/v1
