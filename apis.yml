  date: '2026-08-13'
  status: enriched
  artifacts_added: 17
  pass: local-v1
  note: >-
    Previously recorded as having no API surface. STEP 0b contract discovery found a real
    OpenAPI 3.0.0 served unauthenticated through a Swagger UI at
    https://app-api.hilberts.ai/api-docs, reached by reading the API base out of the
    app.hilberts.ai JavaScript bundle after every /.well-known/ and spec path on the
    marketing and app hosts missed. Ownership confirmed under STEP 0c: the spec
    self-identifies as "Hilbert's Program" (hilbertsprogram.com), which is this company's
    former identity and 301s to hilberts.ai. The document declares zero operations
    (paths is an empty object). A 1200-request per 60-second rate limit was observed at
    runtime from x-ratelimit-* headers though it is documented nowhere. No MCP server,
    no agent card, no SDKs, no webhooks and no published pricing.
