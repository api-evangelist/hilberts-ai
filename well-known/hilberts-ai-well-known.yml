  (app-api.hilberts.ai) 404 on every /.well-known/ path. The application host
  (app.hilberts.ai) is a single-page-app catch-all that answers HTTP 200 with the same
  React index.html shell for every path including every /.well-known/ path — those 200s
  are NOT documents and are recorded as misses. The only real documents found are the
  OIDC discovery and RFC 8414 authorization-server metadata served by the provider's own
  Auth0 tenant, hilbert-app.us.auth0.com, which is the issuer the app.hilberts.ai bundle
  is configured against (audience https://app-api.hilberts.ai). No security.txt is served
  on any host, so no SecurityTxt pointer is emitted.
